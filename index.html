<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>抓大眼 · 克苏鲁的小点心</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="app">
  <div id="stage">
    <canvas id="game"></canvas>
    <div class="scan"></div>
    <div id="hud"><span>盘中供品</span><b id="left">63</b></div>
    <div id="toast"></div>
  </div>
  <footer id="bar">
    <div class="san">
      <span>SAN</span>
      <div class="track"><i id="sanFill"></i></div>
      <b id="sanNum">100</b>
    </div>
    <div class="btns">
      <button id="btnUndo">撤销</button>
      <button id="btnShuffle">洗牌 <b>3</b></button>
      <button id="btnRestart">重开</button>
    </div>
  </footer>
  <div id="end">
    <div class="card">
      <h1 id="endTitle">献祭完成</h1>
      <p id="endText"></p>
      <button id="btnAgain">再来一局</button>
    </div>
  </div>
</main>
<script src="js/util.js"></script>
<script src="js/projection.js"></script>
<script src="js/sprites.js"></script>
<script src="js/board.js"></script>
<script src="js/game.js"></script>
<script src="js/monster.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
