<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>抓大眼 · 克苏鲁的小点心</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="app">
  <div id="stage">
    <canvas id="game"></canvas>
    <div class="scan"></div>
    <div id="hud"><span>盘中供品</span><b id="left">63</b></div>
    <div id="toast"></div>
    <button id="btnMenu" class="icon" aria-label="菜单">☰</button>
  </div>
  <footer id="bar">
    <div class="san">
      <span>SAN</span>
      <div class="track"><i id="sanFill"></i></div>
      <b id="sanNum">100</b>
    </div>
    <div class="btns">
      <button id="btnUndo">撤销</button>
      <button id="btnShuffle">洗牌 <b>3</b></button>
      <button id="btnRestart">重开</button>
    </div>
  </footer>
  <div id="end">
    <div class="card">
      <h1 id="endTitle">献祭完成</h1>
      <p id="endText"></p>
      <div class="row"><button id="btnAgain">再来一局</button><button id="btnToLevels" class="ghost">回到关卡</button></div>
    </div>
  </div>
  <!-- 开始界面 -->
  <div id="title" class="show">
    <div class="veil"></div>
    <div class="titlebox">
      <p class="kicker">— 深 渊 献 祭 —</p>
      <h1 class="logo">抓大眼</h1>
      <p class="sub">克苏鲁的小点心</p>
      <div class="menu">
        <button id="btnStart">开始献祭</button>
        <button id="btnLevels" class="ghost">选择关卡</button>
      </div>
      <p class="hint" id="loadHint">祂正在醒来……</p>
    </div>
  </div>
  <!-- 关卡选择 -->
  <div id="levels">
    <div class="veil"></div>
    <div class="levelbox">
      <h2>选择祭夜</h2>
      <div id="levelList"></div>
      <button id="btnBack" class="ghost back">返回</button>
    </div>
  </div>
</main>
<script src="js/util.js"></script>
<script src="js/projection.js"></script>
<script src="js/sprites.js"></script>
<script src="js/board.js"></script>
<script src="js/game.js"></script>
<script src="js/monster.js"></script>
<script src="js/vendor/three.min.js"></script>
<script src="js/monster3d.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
